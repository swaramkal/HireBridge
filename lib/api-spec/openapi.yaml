openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HireBridge API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: candidates
    description: Candidate operations
  - name: companies
    description: Company operations
  - name: jobs
    description: Job operations
  - name: applications
    description: Application operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: skills
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Create candidate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/stats:
    get:
      operationId: getCandidateStats
      tags: [candidates]
      summary: Get candidate dashboard stats
      responses:
        "200":
          description: Candidate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateStats"

  /candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get candidate by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "404":
          description: Not found
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Register company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Not found
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: companyId
          in: query
          schema:
            type: integer
        - name: skills
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Post a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - name: candidateId
          in: query
          schema:
            type: integer
        - name: jobId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, reviewed, accepted, rejected]
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Apply to a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}:
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin platform overview stats
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/candidates/{id}/status:
    patch:
      operationId: updateCandidateStatus
      tags: [admin]
      summary: Approve or reject a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /admin/companies/{id}/status:
    patch:
      operationId: updateCompanyStatus
      tags: [admin]
      summary: Approve or reject a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Candidate:
      type: object
      required: [id, fullName, email, phone, location, qualification, skills, status, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        qualification:
          type: string
        skills:
          type: string
        objective:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string

    CandidateInput:
      type: object
      required: [fullName, email, phone, location, qualification, skills]
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        qualification:
          type: string
        skills:
          type: string
        objective:
          type: string
        photoUrl:
          type: string

    CandidateUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        location:
          type: string
        qualification:
          type: string
        skills:
          type: string
        objective:
          type: string
        photoUrl:
          type: string

    CandidateStats:
      type: object
      required: [total, pending, approved, rejected]
      properties:
        total:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer

    Company:
      type: object
      required: [id, name, email, industry, description, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        industry:
          type: string
        description:
          type: string
        website:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string

    CompanyInput:
      type: object
      required: [name, email, industry, description]
      properties:
        name:
          type: string
        email:
          type: string
        industry:
          type: string
        description:
          type: string
        website:
          type: string
        logoUrl:
          type: string

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        description:
          type: string
        website:
          type: string
        logoUrl:
          type: string

    Job:
      type: object
      required: [id, title, companyId, companyName, skills, type, description, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        companyId:
          type: integer
        companyName:
          type: string
        skills:
          type: string
        type:
          type: string
          enum: [IT, NonIT]
        description:
          type: string
        location:
          type: ["string", "null"]
        salary:
          type: ["string", "null"]
        createdAt:
          type: string

    JobInput:
      type: object
      required: [title, companyId, skills, type, description]
      properties:
        title:
          type: string
        companyId:
          type: integer
        skills:
          type: string
        type:
          type: string
          enum: [IT, NonIT]
        description:
          type: string
        location:
          type: string
        salary:
          type: string

    JobUpdate:
      type: object
      properties:
        title:
          type: string
        skills:
          type: string
        type:
          type: string
          enum: [IT, NonIT]
        description:
          type: string
        location:
          type: string
        salary:
          type: string

    Application:
      type: object
      required: [id, candidateId, jobId, status, createdAt]
      properties:
        id:
          type: integer
        candidateId:
          type: integer
        jobId:
          type: integer
        candidateName:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, reviewed, accepted, rejected]
        createdAt:
          type: string

    ApplicationInput:
      type: object
      required: [candidateId, jobId]
      properties:
        candidateId:
          type: integer
        jobId:
          type: integer

    ApplicationUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, reviewed, accepted, rejected]

    AdminStats:
      type: object
      required: [totalCandidates, pendingCandidates, totalCompanies, pendingCompanies, totalJobs, totalApplications]
      properties:
        totalCandidates:
          type: integer
        pendingCandidates:
          type: integer
        totalCompanies:
          type: integer
        pendingCompanies:
          type: integer
        totalJobs:
          type: integer
        totalApplications:
          type: integer

    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
